name: IPTV Live HLS Streamer Pro

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  stream:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install System Packages & Cloudflared
        run: |
          export DEBIAN_FRONTEND=noninteractive
          
          if command -v sudo >/dev/null 2>&1; then
            SUDO="sudo"
          else
            SUDO=""
          fi

          # تثبيت الأدوات الأساسية
          $SUDO apt-get update -y -qq || true
          $SUDO apt-get install -y -f --no-install-recommends ffmpeg git rsync python3 curl || true

          # تثبيت Cloudflared للبث المباشر بدون كاش
          if ! command -v cloudflared >/dev/null 2>&1; then
            echo "جاري تثبيت Cloudflared..."
            curl -L -o cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
            $SUDO dpkg -i cloudflared.deb || $SUDO apt-get install -f -y
            rm -f cloudflared.deb
          fi

      - name: Create Channel List
        run: |
          cat > channels.txt <<'EOF'
          bein-news|http://xlion.net:8080/live/15034094901029/18800196589372/443146.ts
          bein-1|http://xlion.net:8080/live/15034094901029/18800196589372/325793.ts
          bein-2|http://xlion.net:8080/live/15034094901029/18800196589372/325794.ts
          bein-3|http://xlion.net:8080/live/15034094901029/18800196589372/325795.ts
          bein-4|http://xlion.net:8080/live/15034094901029/18800196589372/325796.ts
          bein-5|http://xlion.net:8080/live/15034094901029/18800196589372/325797.ts
          bein-6|http://xlion.net:8080/live/15034094901029/18800196589372/325798.ts
          bein-7|http://xlion.net:8080/live/15034094901029/18800196589372/325799.ts
          bein-8|http://xlion.net:8080/live/15034094901029/18800196589372/325800.ts
          bein-movies-1|http://xlion.net:8080/live/15034094901029/18800196589372/319672.ts
          bein-movies-2|http://xlion.net:8080/live/15034094901029/18800196589372/319673.ts
          al-thamanya-1|http://xlion.net:8080/live/15034094901029/18800196589372/429516.ts
          al-thamanya-2|http://xlion.net:8080/live/15034094901029/18800196589372/429517.ts
          al-thamanya-3|http://xlion.net:8080/live/15034094901029/18800196589372/429518.ts
          mbc-2|http://xlion.net:8080/live/15034094901029/18800196589372/45168.ts
          mbc-3|http://xlion.net:8080/live/15034094901029/18800196589372/45143.ts
          mbc-4|http://xlion.net:8080/live/15034094901029/18800196589372/45164.ts
          mbc-5|http://xlion.net:8080/live/15034094901029/18800196589372/92759.ts
          al-aoula|http://xlion.net:8080/live/15034094901029/18800196589372/414017.ts
          2m-maroc|http://xlion.net:8080/live/15034094901029/18800196589372/413999.ts
          arryadia-hd|http://pro.netmos.ovh:7355/live/UDJPRCRA1L055B/Ep27yiiwbb56mjkl/187244.ts
          quran-karim|http://xlion.net:8080/live/15034094901029/18800196589372/413749.ts
          national-geographic|http://xlion.net:8080/live/15034094901029/18800196589372/15026.ts
          EOF

      - name: Start Live Web Server & Tunnel
        run: |
          mkdir -p hls

          # إنشاء خادم ويب بلغة بايثون يمنع الكاش ويسمح بـ CORS
          cat << 'PYEOF' > server.py
          import http.server, socketserver, os

          class NoCacheHandler(http.server.SimpleHTTPRequestHandler):
              def end_headers(self):
                  self.send_header('Access-Control-Allow-Origin', '*')
                  self.send_header('Cache-Control', 'no-cache, no-store, must-revalidate')
                  self.send_header('Pragma', 'no-cache')
                  self.send_header('Expires', '0')
                  super().end_headers()

          os.chdir('hls')
          with socketserver.TCPServer(("", 8080), NoCacheHandler) as httpd:
              httpd.serve_forever()
          PYEOF

          python3 server.py &

          # تشغيل Cloudflare Tunnel للحصول على رابط مباشر بدون كاش
          pkill -f cloudflared || true
          cloudflared tunnel --url http://localhost:8080 > tunnel.log 2>&1 &

          echo "في انتظار توليد رابط البث المباشر..."
          sleep 8

          TUNNEL_URL=""
          for i in {1..15}; do
            TUNNEL_URL=$(grep -o 'https://[-a-zA-Z0-9.]*\.trycloudflare\.com' tunnel.log | head -n 1 || true)
            if [ -n "$TUNNEL_URL" ]; then
              break
            fi
            sleep 2
          done

          echo "TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_ENV
          echo "Live Stream Base Domain: $TUNNEL_URL"

      - name: Generate M3U Playlist & Push to Main Branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # إنشاء ملف index.m3u الرئيسي للتشغيل
          cat > index.m3u <<'EOF'
          #EXTM3U
          EOF

          while IFS='|' read -r NAME URL; do
            mkdir -p "hls/$NAME"
            TITLE=$(echo "$NAME" | sed 's/-/ /g')
            cat >> index.m3u <<EOF
          #EXTINF:-1,$TITLE
          ${{ env.TUNNEL_URL }}/$NAME/index.m3u8
          EOF
          done < channels.txt

          # نسخ الملف إلى مجلد البث المباشر أيضاً
          cp index.m3u hls/index.m3u

          # رفعه فوراً إلى الفرع الرئيسي main
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.m3u
          git commit -m "Update live M3U playlist file [skip ci]" || true
          git push origin main || true

          # طباعة ملخص الرابط في واجهة GitHub Actions
          RAW_M3U_URL="https://raw.githubusercontent.com/${{ github.repository }}/main/index.m3u"
          TUNNEL_M3U_URL="${{ env.TUNNEL_URL }}/index.m3u"

          echo "### 🚀 رابط قائمة القنوات جاهز للبث المباشر" >> $GITHUB_STEP_SUMMARY
          echo "**1. رابط تحميل/تشغيل الملف من GitHub الرئيسي (Raw):**" >> $GITHUB_STEP_SUMMARY
          echo "\`$RAW_M3U_URL\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**2. رابط التشغيل المباشر والسريع جداً (Cloudflare):**" >> $GITHUB_STEP_SUMMARY
          echo "\`$TUNNEL_M3U_URL\`" >> $GITHUB_STEP_SUMMARY

      - name: Start Continuous FFmpeg Streaming
        run: |
          while IFS='|' read -r NAME URL; do
            echo "Starting stream for: $NAME"

            (
              while true; do
                ffmpeg \
                  -hide_banner \
                  -loglevel warning \
                  -reconnect 1 \
                  -reconnect_streamed 1 \
                  -reconnect_delay_max 5 \
                  -rw_timeout 10000000 \
                  -i "$URL" \
                  -map 0:v:0? \
                  -map 0:a:0? \
                  -c copy \
                  -f hls \
                  -hls_time 3 \
                  -hls_list_size 6 \
                  -hls_flags delete_segments+append_list+omit_endlist \
                  -hls_segment_filename "hls/$NAME/segment_%03d.ts" \
                  "hls/$NAME/index.m3u8"

                echo "Stream $NAME lost connection, auto-restarting..."
                sleep 2
              done
            ) &

          done < channels.txt

          echo "All channels are streaming live..."
          sleep 19800

          pkill -f ffmpeg || true
          pkill -f python3 || true
          pkill -f cloudflared || true
