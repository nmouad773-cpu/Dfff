name: IPTV Live HLS Streamer Pro

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: iptv-live-stream
  cancel-in-progress: true

jobs:
  stream:
    runs-on: self-hosted

    steps:

      # =========================================================
      # 1. تحميل المشروع
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      # =========================================================
      # 2. تثبيت FFmpeg والأدوات
      # =========================================================
      - name: Install System Packages
        run: |
          export DEBIAN_FRONTEND=noninteractive

          if command -v sudo >/dev/null 2>&1; then
            SUDO="sudo"
          else
            SUDO=""
          fi

          $SUDO apt-get update -y -qq || true

          $SUDO apt-get install -y -f --no-install-recommends \
            ffmpeg \
            git \
            rsync \
            python3 \
            curl \
            procps \
            net-tools \
            || true

          echo "FFmpeg version:"
          ffmpeg -version | head -n 1

      # =========================================================
      # 3. قائمة القنوات
      # =========================================================
      - name: Create Channel List
        run: |
          cat > channels.txt <<'EOF'
          bein-news|http://xlion.net:8080/live/15034094901029/18800196589372/443146.ts
          bein-1|http://xlion.net:8080/live/15034094901029/18800196589372/325793.ts
          bein-2|http://xlion.net:8080/live/15034094901029/18800196589372/325794.ts
          bein-3|http://xlion.net:8080/live/15034094901029/18800196589372/325795.ts
          bein-4|http://xlion.net:8080/live/15034094901029/18800196589372/325796.ts
          bein-5|http://xlion.net:8080/live/15034094901029/18800196589372/325797.ts
          bein-6|http://xlion.net:8080/live/15034094901029/18800196589372/325798.ts
          bein-7|http://xlion.net:8080/live/15034094901029/18800196589372/325799.ts
          bein-8|http://xlion.net:8080/live/15034094901029/18800196589372/325800.ts
          bein-movies-1|http://xlion.net:8080/live/15034094901029/18800196589372/319672.ts
          bein-movies-2|http://xlion.net:8080/live/15034094901029/18800196589372/319673.ts
          al-thamanya-1|http://xlion.net:8080/live/15034094901029/18800196589372/429516.ts
          al-thamanya-2|http://xlion.net:8080/live/15034094901029/18800196589372/429517.ts
          al-thamanya-3|http://xlion.net:8080/live/15034094901029/18800196589372/429518.ts
          mbc-2|http://xlion.net:8080/live/15034094901029/18800196589372/45168.ts
          mbc-3|http://xlion.net:8080/live/15034094901029/18800196589372/45143.ts
          mbc-4|http://xlion.net:8080/live/15034094901029/18800196589372/45164.ts
          mbc-5|http://xlion.net:8080/live/15034094901029/18800196589372/92759.ts
          al-aoula|http://xlion.net:8080/live/15034094901029/18800196589372/414017.ts
          2m-maroc|http://xlion.net:8080/live/15034094901029/18800196589372/413999.ts
          arryadia-hd|http://pro.netmos.ovh:7355/live/UDJPRCRA1L055B/Ep27yiiwbb56mjkl/187244.ts
          quran-karim|http://xlion.net:8080/live/15034094901029/18800196589372/413749.ts
          national-geographic|http://xlion.net:8080/live/15034094901029/18800196589372/15026.ts
          EOF

      # =========================================================
      # 4. إنشاء HLS
      # =========================================================
      - name: Prepare HLS
        run: |
          mkdir -p hls

          while IFS='|' read -r NAME URL; do
            [ -z "$NAME" ] && continue

            mkdir -p "hls/$NAME"

            rm -f "hls/$NAME/"*.ts
            rm -f "hls/$NAME/index.m3u8"

          done < channels.txt

      # =========================================================
      # 5. إنشاء index.m3u الخاص بـ GitHub
      # =========================================================
      - name: Generate GitHub M3U Playlist
        run: |
          cat > index.m3u <<'EOF'
          #EXTM3U
          EOF

          while IFS='|' read -r NAME URL; do
            [ -z "$NAME" ] && continue

            TITLE=$(echo "$NAME" | sed 's/-/ /g')

            cat >> index.m3u <<EOF
          #EXTINF:-1,$TITLE
          https://raw.githubusercontent.com/${{ github.repository }}/main/hls/$NAME/index.m3u8
          EOF

          done < channels.txt

          cp index.m3u hls/index.m3u

          echo "================================="
          echo "GitHub M3U:"
          echo "https://raw.githubusercontent.com/${{ github.repository }}/main/index.m3u"
          echo "================================="

      # =========================================================
      # 6. رفع index.m3u إلى GitHub
      # =========================================================
      - name: Push M3U to GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.m3u

          git diff --cached --quiet || \
            git commit -m "Update IPTV playlist [skip ci]"

          git push origin main || true

      # =========================================================
      # 7. تشغيل HTTP Server داخلي
      # =========================================================
      - name: Start Local HLS Server
        run: |
          cat > server.py <<'PYEOF'
          import http.server
          import socketserver
          import os

          PORT = 8080

          class NoCacheHandler(http.server.SimpleHTTPRequestHandler):

              def end_headers(self):
                  self.send_header(
                      "Access-Control-Allow-Origin",
                      "*"
                  )

                  self.send_header(
                      "Cache-Control",
                      "no-cache, no-store, must-revalidate"
                  )

                  self.send_header(
                      "Pragma",
                      "no-cache"
                  )

                  self.send_header(
                      "Expires",
                      "0"
                  )

                  super().end_headers()

          os.chdir("hls")

          class ReusableTCPServer(
              socketserver.ThreadingTCPServer
          ):
              allow_reuse_address = True

          with ReusableTCPServer(
              ("127.0.0.1", PORT),
              NoCacheHandler
          ) as httpd:

              print(
                  f"HLS server running on http://127.0.0.1:{PORT}"
              )

              httpd.serve_forever()
          PYEOF

          # إيقاف أي نسخة قديمة
          pkill -f "python3 server.py" || true

          sleep 1

          python3 server.py > server.log 2>&1 &

          sleep 2

          echo "HLS server started."

      # =========================================================
      # 8. تشغيل جميع القنوات
      # =========================================================
      - name: Start Continuous FFmpeg Streaming
        run: |

          # تنظيف FFmpeg قديم
          pkill -f "ffmpeg.*hls" || true

          sleep 2

          while IFS='|' read -r NAME URL; do

            [ -z "$NAME" ] && continue

            echo "=========================================="
            echo "Starting channel: $NAME"
            echo "Source: $URL"
            echo "=========================================="

            (
              while true; do

                echo "[$NAME] Starting FFmpeg..."

                rm -f "hls/$NAME/index.m3u8"

                ffmpeg \
                  -hide_banner \
                  -loglevel warning \
                  -nostdin \
                  -re \
                  -reconnect 1 \
                  -reconnect_streamed 1 \
                  -reconnect_at_eof 1 \
                  -reconnect_delay_max 5 \
                  -rw_timeout 10000000 \
                  -thread_queue_size 4096 \
                  -fflags +genpts+discardcorrupt \
                  -i "$URL" \
                  -map 0:v:0? \
                  -map 0:a:0? \
                  -c:v copy \
                  -c:a copy \
                  -f hls \
                  -hls_time 3 \
                  -hls_list_size 6 \
                  -hls_delete_threshold 2 \
                  -hls_flags delete_segments+append_list+omit_endlist \
                  -hls_segment_filename "hls/$NAME/segment_%03d.ts" \
                  "hls/$NAME/index.m3u8"

                EXIT_CODE=$?

                echo "[$NAME] FFmpeg stopped with code: $EXIT_CODE"
                echo "[$NAME] Restarting in 2 seconds..."

                sleep 2

              done

            ) &

          done < channels.txt

          echo ""
          echo "=========================================="
          echo "ALL CHANNELS STARTED"
          echo "=========================================="
          echo ""
          echo "GitHub M3U:"
          echo "https://raw.githubusercontent.com/${{ github.repository }}/main/index.m3u"
          echo ""

          # 5 ساعات و30 دقيقة
          sleep 19800

          echo "Stopping all streams..."

          pkill -f ffmpeg || true
          pkill -f "python3 server.py" || true

      # =========================================================
      # 9. إظهار السجلات في حالة الخطأ
      # =========================================================
      - name: Show Server Logs
        if: always()
        run: |
          echo "========== SERVER LOG =========="
          cat server.log 2>/dev/null || true

          echo ""
          echo "========== RUNNING PROCESSES =========="
          ps aux | grep -E "ffmpeg|server.py" | grep -v grep || true

          echo ""
          echo "========== PORT 8080 =========="
          ss -ltnp 2>/dev/null | grep :8080 || true
