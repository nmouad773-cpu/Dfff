name: IPTV HLS Restreaming Pro

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  stream:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check and Install Required Packages
        run: |
          export DEBIAN_FRONTEND=noninteractive
          
          if command -v sudo >/dev/null 2>&1; then
            SUDO="sudo"
          else
            SUDO=""
          fi

          if command -v ffmpeg >/dev/null 2>&1 && command -v git >/dev/null 2>&1 && command -v rsync >/dev/null 2>&1; then
            echo "جميع الأدوات مثبتة ومجهزة!"
          else
            $SUDO rm -f /var/log/apt/eipp.log.xz /var/lib/dpkg/lock* /var/lib/apt/lists/lock || true
            $SUDO dpkg --configure -a || true
            $SUDO apt-get clean || true
            $SUDO apt-get update -y -qq || true
            $SUDO apt-get install -y -f --no-install-recommends ffmpeg git rsync || true
          fi

      - name: Create Channel List
        run: |
          cat > channels.txt <<'EOF'
          bein-news|http://xlion.net:8080/live/15034094901029/18800196589372/443146.ts
          bein-1|http://xlion.net:8080/live/15034094901029/18800196589372/325793.ts
          bein-2|http://xlion.net:8080/live/15034094901029/18800196589372/325794.ts
          bein-3|http://xlion.net:8080/live/15034094901029/18800196589372/325795.ts
          bein-4|http://xlion.net:8080/live/15034094901029/18800196589372/325796.ts
          bein-5|http://xlion.net:8080/live/15034094901029/18800196589372/325797.ts
          bein-6|http://xlion.net:8080/live/15034094901029/18800196589372/325798.ts
          bein-7|http://xlion.net:8080/live/15034094901029/18800196589372/325799.ts
          bein-8|http://xlion.net:8080/live/15034094901029/18800196589372/325800.ts
          bein-movies-1|http://xlion.net:8080/live/15034094901029/18800196589372/319672.ts
          bein-movies-2|http://xlion.net:8080/live/15034094901029/18800196589372/319673.ts
          al-thamanya-1|http://xlion.net:8080/live/15034094901029/18800196589372/429516.ts
          al-thamanya-2|http://xlion.net:8080/live/15034094901029/18800196589372/429517.ts
          al-thamanya-3|http://xlion.net:8080/live/15034094901029/18800196589372/429518.ts
          mbc-2|http://xlion.net:8080/live/15034094901029/18800196589372/45168.ts
          mbc-3|http://xlion.net:8080/live/15034094901029/18800196589372/45143.ts
          mbc-4|http://xlion.net:8080/live/15034094901029/18800196589372/45164.ts
          mbc-5|http://xlion.net:8080/live/15034094901029/18800196589372/92759.ts
          al-aoula|http://xlion.net:8080/live/15034094901029/18800196589372/414017.ts
          2m-maroc|http://xlion.net:8080/live/15034094901029/18800196589372/413999.ts
          arryadia-hd|http://pro.netmos.ovh:7355/live/UDJPRCRA1L055B/Ep27yiiwbb56mjkl/187244.ts
          quran-karim|http://xlion.net:8080/live/15034094901029/18800196589372/413749.ts
          national-geographic|http://xlion.net:8080/live/15034094901029/18800196589372/15026.ts
          EOF

      - name: Start Continuous Streaming & Force Sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p hls
          GH_PAGES_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"

          # إنشاء ملف التشغيل الرئيسي index.m3u
          cat > hls/index.m3u <<'EOF'
          #EXTM3U
          EOF

          while IFS='|' read -r NAME URL; do
            mkdir -p "hls/$NAME"
            TITLE=$(echo "$NAME" | sed 's/-/ /g')
            cat >> hls/index.m3u <<EOF
          #EXTINF:-1,$TITLE
          $GH_PAGES_URL/hls/$NAME/index.m3u8
          EOF
          done < channels.txt

          # حلقة المزامنة السريعة: ترفع فقط آخر لقطات البث وبشكل Force لمنع تضخم المستودع
          (
            while true; do
              sleep 6
              if [ -d "hls" ]; then
                rm -rf deploy_tmp
                mkdir -p deploy_tmp
                cp -r hls deploy_tmp/
                cd deploy_tmp
                git init
                git checkout --orphan gh-pages
                git add -A
                git commit -m "Live Sync" || true
                git push --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" gh-pages >/dev/null 2>&1 || true
                cd ..
                rm -rf deploy_tmp
              fi
            done
          ) &

          # تشغيل البث عبر FFmpeg مع إعادة الاتصال التلقائي وتثبيت شريحة البث
          while IFS='|' read -r NAME URL; do
            echo "Starting stream for: $NAME"

            (
              while true; do
                ffmpeg \
                  -hide_banner \
                  -loglevel warning \
                  -reconnect 1 \
                  -reconnect_streamed 1 \
                  -reconnect_delay_max 5 \
                  -rw_timeout 10000000 \
                  -i "$URL" \
                  -map 0:v:0? \
                  -map 0:a:0? \
                  -c copy \
                  -f hls \
                  -hls_time 3 \
                  -hls_list_size 6 \
                  -hls_flags delete_segments+append_list+omit_endlist \
                  -hls_segment_filename "hls/$NAME/segment_%03d.ts" \
                  "hls/$NAME/index.m3u8"

                echo "Stream $NAME lost connection, auto-restarting..."
                sleep 2
              done
            ) &

          done < channels.txt

          echo "Streaming is live..."
          sleep 19800

          pkill -f ffmpeg || true
